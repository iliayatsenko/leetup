services:
  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.2
    platform: linux/amd64
    container_name: leetcode-api
    ports:
      - "${LEETCODE_API_PORT:-3000}:3000"
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    platform: linux/amd64
    container_name: opencode
    env_file: .env
    environment:
      OPENCODE_CONFIG: /workspace/.opencode/opencode.jsonc
    volumes:
      - .:/workspace
    tty: true
    working_dir: /workspace
  postgres:
    image: postgres:16-alpine
    container_name: leetup-postgres
    environment:
      POSTGRES_USER: leetup
      POSTGRES_PASSWORD: leetup
      POSTGRES_DB: leetup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "leetup", "-d", "leetup"]
      interval: 2s
      timeout: 5s
      retries: 15
  leetup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetup
    environment:
      - HOST_PROJECT_PATH=${PWD}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - PHP_IDE_SERVER_NAME=${PHP_IDE_SERVER_NAME:-leetup}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432} # only printed in the connection DSN after setup
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock # Map Docker socket for running commands in opencode and postgres containers
    ports:
      - "${DELVE_PORT:-40000}:40000"
      - "${NODE_INSPECT_PORT:-9229}:9229"
    cap_add:
      - SYS_PTRACE # needed by delve
    security_opt:
      - apparmor=unconfined # needed by delve
    depends_on:
      leetcode-api:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
