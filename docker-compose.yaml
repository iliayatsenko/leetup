services:
  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.2
    platform: linux/amd64
    container_name: leetcode-api
    ports:
      - "${LEETCODE_API_PORT:-3000}:3000"
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    platform: linux/amd64
    container_name: opencode
    entrypoint: ["sleep", "infinity"]
    environment:
      OPENCODE_CONFIG: /workspace/.opencode/opencode.jsonc
    volumes:
      - .:/workspace
    working_dir: /workspace
  mysql:
    image: mysql:8.0 # the version LeetCode runs
    container_name: leetup-mysql
    # LeetCode enables no SQL mode (no ONLY_FULL_GROUP_BY, no strict mode), so neither do we
    command: ["--sql-mode="]
    environment:
      MYSQL_ROOT_PASSWORD: leetup
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      # 127.0.0.1 rather than localhost: the temporary server of the first start listens
      # on the socket only, so this passes once the real server is up
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pleetup"]
      interval: 2s
      timeout: 5s
      retries: 30
  leetup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetup
    environment:
      - HOST_PROJECT_PATH=${PWD}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - PHP_IDE_SERVER_NAME=${PHP_IDE_SERVER_NAME:-leetup}
      - MYSQL_PORT=${MYSQL_PORT:-3306} # only printed in the connection DSN after setup
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock # Map Docker socket for running commands in opencode and mysql containers
    ports:
      - "${DELVE_PORT:-40000}:40000"
      - "${NODE_INSPECT_PORT:-9229}:9229"
    cap_add:
      - SYS_PTRACE # needed by delve
    security_opt:
      - apparmor=unconfined # needed by delve
    depends_on:
      leetcode-api:
        condition: service_started
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
