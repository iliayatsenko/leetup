services:
  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.2
    platform: linux/amd64
    container_name: leetcode-api
    ports:
      - "${LEETCODE_API_PORT:-3000}:3000"
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    platform: linux/amd64
    container_name: opencode
    env_file: .env
    environment:
      OPENCODE_CONFIG: /workspace/.opencode/opencode.jsonc
    volumes:
      - .:/workspace
    tty: true
    working_dir: /workspace
  leetup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetup
    # Everything the host varies in lands here rather than in the image, so that
    # changing .env only needs a container restart. Listed one by one instead of
    # env_file, which would also hand the opencode API key to this container
    environment:
      - HOST_PROJECT_PATH=${PWD} # needed by delve for container-to-host paths mapping
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - PHP_IDE_SERVER_NAME=${PHP_IDE_SERVER_NAME:-leetup}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock # Map Docker socket in order to run commands in opencode container
    ports:
      - "${DELVE_PORT:-40000}:40000" # delve port
    cap_add:
      - SYS_PTRACE # needed by delve
    security_opt:
      - apparmor=unconfined # needed by delve
    depends_on:
      - leetcode-api
